name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Route validation tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Realm route integrity check
        run: node_modules/.bin/sucrase-node tests/realm_routes.test.ts

      - name: Route constant ↔ screen file cross-check
        run: node scripts/check-routes.js
