; Minimal, unsigned export-preset stubs (Android / iOS / Desktop).
;
; These presets are structural placeholders for the M1-P1 skeleton. They do
; not include any signing credentials/keystores, do not claim a verified
; real export, and were not opened in the Godot editor (no Godot executable
; was available while authoring this skeleton). `runnable=false` on every
; preset reflects that these have not been exercised end-to-end.
;
; Before a real export: open this project in Godot 4.3+, let the editor
; regenerate/validate this file, install the relevant export templates, and
; supply signing credentials through Godot's own secure preset UI (never by
; committing them here).

