<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      html,
      body {
        height: 100%;
      }

      body {
        overflow: hidden;
        padding: 0;
        margin: 0;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>

    <!--
      DEV ONLY — Canvas / screenshot QA helpers
      ─────────────────────────────────────────
      ?qa_inject=1   Seeds localStorage with a mock mid-game player and
                     redirects to /?qa_direct_hub=1 so the hub renders
                     without going through title → preloader.
                     Uses a fake UUID (00000000-…-0099) so the backend GET
                     returns 404 and the store keeps local data.

      ?qa_player_id=<uuid>  (legacy) Loads a real backend player by ID,
                     patches routing flags, and drops into /preloader.
                     Requires the backend to be accessible from the same
                     origin — only works in local dev shell curl, not in
                     canvas iframes where localhost is unreachable.
    -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);

        /* ── New: ?qa_inject=1 ── */
        if (params.get('qa_inject') === '1') {
          var mockPlayer = {
            "id": "00000000-0000-0000-0000-000000000099",
            "name": "Aria",
            "pronouns": "she/her",
            "aptitude": "curious",
            "rank_index": 3,
            "xp": 480,
            "stamina": 14,
            "last_stamina_update": new Date().toISOString(),
            "crowns": 240,
            "codex_shards": 18,
            "refined_lotus_gems": 3,
            "lotus_gems_paid": 0,
            "heroes_owned": [
              {
                "id": "wardlight_apprentice",
                "gender": "female",
                "name": "Wardlight Apprentice",
                "title": "Keeper of the Lantern",
                "family": "Wardborn",
                "rarityTier": "common",
                "rarity": 1,
                "role": "Stabilizer",
                "element": "River",
                "stats": { "insight": 10, "carePower": 10, "intervention": 5, "guard": 8, "coordination": 7 },
                "strongAffinities": ["Fluid / Hydration"],
                "weakAffinities": ["Wound / Tissue"],
                "roleTags": ["healer", "frontline", "support"],
                "description": "A new ward nurse who carries the lantern through every night shift.",
                "skills": []
              },
              {
                "id": "gentle_hands_aide",
                "gender": "female",
                "name": "Gentle Hands Aide",
                "title": "Keeper of Calm Waters",
                "family": "Wardborn",
                "rarityTier": "common",
                "rarity": 1,
                "role": "Stabilizer",
                "element": "River",
                "stats": { "insight": 11, "carePower": 12, "intervention": 5, "guard": 9, "coordination": 8 },
                "strongAffinities": ["Fluid / Hydration"],
                "weakAffinities": ["Wound / Tissue"],
                "roleTags": ["healer", "support"],
                "description": "A seasoned aide who has steadied countless patients through the night.",
                "skills": []
              }
            ],
            "active_team": ["wardlight_apprentice", "gentle_hands_aide"],
            "hero_progression": {
              "wardlight_apprentice": { "id": "wardlight_apprentice", "level": 6, "star": 1, "xp": 210 },
              "gentle_hands_aide":   { "id": "gentle_hands_aide",   "level": 4, "star": 1, "xp": 80  }
            },
            "chapter_progress": { "current_chapter": 2, "completed_chapters": [1] },
            "lessons_started": true,
            "diagnostic_intro_seen": true,
            "seen_reminiscence": true,
            "identity_restored": true,
            "onboarding_complete": true,
            "seen_lv2_unlock": true,
            "opening_prologue_complete": true,
            "prologue_phase": "complete",
            "prologue_rewards_claimed": true,
            "daily_rounds": {
              "streak": 3,
              "lastCheckin": new Date(Date.now() - 86400000).toISOString(),
              "claimed_today": false,
              "objectives": [],
              "weekly_tasks": [],
              "claimed_milestones": []
            },
            "claimed_level_milestones": [],
            "claimed_chapter_chests": [],
            "claimed_chapter_3star": []
          };
          try {
            localStorage.setItem('clinica.player.v2', JSON.stringify(mockPlayer));
          } catch (e) {}
          window.location.replace('/?qa_direct_hub=1');
          return;
        }

        /* ── Legacy: ?qa_player_id=<uuid> (local dev only, requires backend on localhost) ── */
        var pid = params.get('qa_player_id');
        if (!pid) return;
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', 'http://localhost:8000/api/player/' + pid, false);
          xhr.send(null);
          if (xhr.status === 200) {
            var p = JSON.parse(xhr.responseText);
            p.diagnostic_intro_seen = true;
            p.seen_reminiscence = true;
            p.identity_restored = true;
            p.onboarding_complete = true;
            localStorage.setItem('clinica.player.v2', JSON.stringify(p));
            window.location.replace('/preloader');
          }
        } catch (e) { console.warn('qa_player_id inject failed', e); }
      })();
    </script>
  </body>
</html>
