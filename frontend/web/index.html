<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      html,
      body {
        height: 100%;
      }

      body {
        overflow: hidden;
        padding: 0;
        margin: 0;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <!-- DEV ONLY: ?qa_player_id=<uuid> injects a player session and drops into /preloader -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var pid = params.get('qa_player_id');
        if (!pid) return;
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', 'http://localhost:8000/api/player/' + pid, false); // synchronous
          xhr.send(null);
          if (xhr.status === 200) {
            var p = JSON.parse(xhr.responseText);
            // Ensure flags route directly to hub (not post-recall / reminiscence)
            p.diagnostic_intro_seen = true;
            p.seen_reminiscence = true;
            p.identity_restored = true;
            p.onboarding_complete = true;
            localStorage.setItem('clinica.player.v2', JSON.stringify(p));
            window.location.replace('/preloader');
          }
        } catch (e) { console.warn('qa_player_id inject failed', e); }
      })();
    </script>
  </body>
</html>
